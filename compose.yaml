services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: "local-compose-secret-change-before-production"
      DATA_FILE: "/app/data/studyflow.json"
    volumes:
      - studyflow-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  studyflow-data:

