openapi: 3.1.0
info:
  title: Daynest API
  version: 1.0.0
  description: 学习目标、任务、专注会话、词汇学习和实时事件 API。
servers:
  - url: http://localhost:8080
tags:
  - name: Parcels
  - name: Transfers
  - name: Whiteboards
  - name: Splits
  - name: Search
  - name: Care
  - name: Fitness
  - name: AI
  - name: Meals
  - name: Subscriptions
  - name: Auth
  - name: Goals
  - name: Moods
  - name: Calendar
  - name: Tasks
  - name: Todos
  - name: Planner
  - name: Vocabulary
  - name: Focus
  - name: Insights
  - name: Memos
  - name: Knowledge
  - name: English
  - name: Literature
  - name: Exports
  - name: Travel
  - name: Inventory
  - name: Shopping
  - name: Bookmarks
paths:
  /api/v1/parcels:
    get:
      tags: [Parcels]
      security: [{ bearerAuth: [] }]
      summary: 列出当前账号快递收件记录（含回收站）
      description: 手动管理，不查询实时物流。响应 Cache-Control 为 no-store，取件码为明文，请保护登录令牌。
      responses:
        '200':
          description: data 为记录数组，包含全部保存字段及 id、user_id、revision、created_at、updated_at、picked_at；未取件 picked_at 为零值时间。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Parcel' }
        '401': { description: 需要登录 }
  /api/v1/parcels/{id}:
    put:
      tags: [Parcels]
      security: [{ bearerAuth: [] }]
      summary: 创建或完整更新收件记录，支持版本校验和原样重试
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveParcelInput' }
      responses:
        '200':
          description: 已保存到服务内存；相同旧版本且相同内容的直接重试返回原记录，不重复创建或更新时间。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Parcel' }
        '400': { description: 输入无效或达到每账号 2000 条上限（含回收站） }
        '401': { description: 需要登录 }
        '404': { description: 更新记录不存在或不属于当前账号 }
        '409': { description: 版本冲突，须重新读取核对，不可盲目覆盖 }
  /api/v1/transfers:
    get:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: List current-account files, expired/trash states and quota
      description: Attachments are separate from JSON snapshots and personal JSON exports. No public links. Known development signing key restricts transfer endpoints to loopback clients; forwarded headers are not trusted for this check.
      responses:
        "200":
          description: No-store account file listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/TransferFile" } }
                      used_bytes: { type: integer, format: int64 }
                      max_bytes: { type: integer, const: 268435456 }
                      max_file_bytes: { type: integer, const: 33554432 }
                      max_files: { type: integer, const: 100 }
                      server_time: { type: string, format: date-time }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
  /api/v1/transfers/info:
    get:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Get private IPv4 candidate service addresses and setup warning
      description: Addresses contain no tokens and are not verified reachable. Does not alter network or firewall settings. With the public development signing key, loopback receives no candidate addresses and a configuration warning.
      responses:
        "200": { description: data contains addresses array and warning string }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
  /api/v1/transfers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Stream an immutable file upload using a client-generated retry ID
      description: Max 32 MiB per file, 256 MiB and 100 records per account including expired/trash records, four simultaneous uploads globally. Known content length is reserved at actual size; unknown chunked length reserves 32 MiB. Same ID/name/content/initial TTL immediate retry returns original record without extending expiry. Files are always downloaded as attachments, not previewed or executed.
      parameters:
        - { in: header, name: X-File-Name, required: true, schema: { type: string }, description: UTF-8 original filename encoded with URL path percent encoding; no path separators/control characters; max 180 Unicode characters after decoding }
        - { in: header, name: X-File-TTL, required: true, schema: { type: string, enum: ["0", "24", "168"] }, description: Hours; zero means no expiry }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: data is the saved TransferFile, including size and upload-time SHA-256 }
        "400": { description: Invalid filename, ID, TTL or size declaration }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
        "409": { description: ID already committed with different content or properties }
        "410": { description: An original upload has already expired }
        "413": { description: File size, account bytes or record count exceeded }
        "429": { description: Upload slots or same-file operation busy }
    delete:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Permanently purge a trashed or expired file and metadata
      responses:
        "204": { description: Permanently removed; unrecoverable }
        "400": { description: Active files must be trashed first }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
        "404": { description: No record in this account; retries may treat as already purged }
        "429": { description: Same file currently uploading }
  /api/v1/transfers/{id}/content:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Download file content with authorization, attachment disposition and Range support
      responses:
        "200": { description: application/octet-stream attachment; no-store and sandbox CSP }
        "206": { description: Authorized partial file content }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
        "404": { description: Missing file or not in current account }
        "410": { description: Expired or trashed file }
    head:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Read authorized attachment headers without file bytes
      responses:
        "200": { description: File headers }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
        "404": { description: Missing file }
        "410": { description: Expired or trashed file }
  /api/v1/transfers/{id}/actions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [Transfers]
      security: [{ bearerAuth: [] }]
      summary: Trash, restore or extend a file's expiry to seven days from now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [trash, restore, extend] }
      responses:
        "200": { description: data is the updated TransferFile }
        "400": { description: Invalid action; restore trashed file before extending }
        "401": { description: Authentication required }
        "403": { description: Development default signing key is local-only }
        "404": { description: No file in this account }
        "429": { description: File currently uploading }
  /api/v1/whiteboards:
    get:
      tags: [Whiteboards]
      security: [{ bearerAuth: [] }]
      summary: List account-scoped saved vector whiteboards including trash
      deprecated: true
      responses:
        "200": { description: data is an array of Whiteboard records; response is no-store }
        "401": { description: Authentication required }
  /api/v1/whiteboards/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Whiteboards]
      security: [{ bearerAuth: [] }]
      summary: Atomically save a whiteboard using optimistic revision
      deprecated: true
      description: Fixed 1600x1000 canvas. Max 60 boards per account including trash, 250 nodes per board, 1000 points per path and 30000 points total. Shapes must stay within bounds. Trashed boards must first be restored before editing. Identical immediate retry returns the original result without incrementing revision. Max request body 1 MiB. No external images or executable SVG input accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWhiteboardInput" }
      responses:
        "200": { description: data is the saved Whiteboard with revision and server-owned timestamps; response is no-store }
        "400": { description: Invalid fields, geometry, limits or JSON }
        "401": { description: Authentication required }
        "404": { description: Missing board in current account }
        "409": { description: Revision conflict; preserve/export draft before reload }
  /api/v1/splits:
    get:
      tags: [Splits]
      security: [{ bearerAuth: [] }]
      summary: List current-account AA bills with computed netting reports
      deprecated: true
      description: Includes soft-deleted bills. No payments or invitations. Max 100 bills per account, including trash. Response is no-store.
      responses:
        "200":
          description: Current-account bills and deterministic integer-cent settlement suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SplitView" } }
        "401": { description: Authentication required }
  /api/v1/splits/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Splits]
      security: [{ bearerAuth: [] }]
      summary: Create or atomically replace an AA bill using optimistic revision
      deprecated: true
      description: New bills use revision zero and must be open and not deleted. Equal splitting distributes remainders in group member order. Exact shares must sum to amount_cents. The payer may be excluded from shares. Settled bills must first be reopened before changing members or expenses; trashed bills must first be restored before editing. An identical immediate retry returns the original result without incrementing revision. Reports are server-owned; this never transfers funds or tracks external payments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSplitInput" }
      responses:
        "200":
          description: Saved bill and report, no-store response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SplitView" }
        "400": { description: Invalid fields, amounts, dates, membership or state }
        "401": { description: Authentication required }
        "404": { description: Missing bill in current account }
        "409": { description: Revision conflict; reload to reconcile }
  /api/v1/search:
    post:
      tags: [Search]
      security: [{ bearerAuth: [] }]
      summary: Search saved content in the current account
      description: Read-only POST keeps keywords out of the URL; no-store response. Literal case-insensitive AND matching across title, content and tags. Up to four source workers, three-second deadline, best 500 retained results. Recycle-bin content and all time-capsule letters are excluded. Dates filter updated_at inclusively in China Standard Time. Calendar recurrence is not expanded. Partial failures appear as source keys in warnings; all sources failing returns 503.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchInput" }
      responses:
        "200":
          description: Matching excerpts, total counts and pagination capped to the best 500 results
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SearchResult" }
        "400": { description: Invalid query, fields, filters or strict JSON }
        "401": { description: Authentication required }
        "503": { description: All requested sources unavailable }
        "504": { description: Search deadline exceeded }
  /api/v1/care-items:
    get:
      tags: [Care]
      security: [{ bearerAuth: [] }]
      summary: List current account recurring life-care items including trash
      responses:
        "200":
          description: Account-scoped items and server time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CareItem" } }
                  server_time: { type: string, format: date-time }
        "401": { description: Authentication required }
  /api/v1/care-items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Care]
      security: [{ bearerAuth: [] }]
      summary: Create or edit life-care metadata with optimistic revision
      description: New entries use revision 0. History, state and counters are server-owned. Changing first_due, interval, unit or rhythm resets the schedule anchor; other edits preserve it. Editing clears completion undo. Identical immediate retry is idempotent. Max 500 items per account including soft deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCareInput" }
      responses:
        "200": { description: data is a CareItem; server_time is UTC date-time }
        "400": { description: Invalid JSON, fields, cycle or date }
        "401": { description: Authentication required }
        "404": { description: Entry not found in current account }
        "409": { description: Version conflict; preserve request before reconciliation }
  /api/v1/care-items/{id}/actions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    post:
      tags: [Care]
      security: [{ bearerAuth: [] }]
      summary: Complete, undo, postpone, pause or archive a life-care item
      description: Retries must keep command_id, revision and the exact body. Rolling schedules advance from actual completion; fixed schedules retain original anchor and skip missed periods without inventing completions. Only the latest completion can be undone before intervening edits/actions. History retains the last 100 entries. Snoozing is not completion. Archived items only accept restore.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareActionInput" }
      responses:
        "200": { description: data is the updated CareItem; server_time is UTC date-time }
        "400": { description: Invalid input, date or undo unavailable }
        "401": { description: Authentication required }
        "404": { description: Item not found in current account }
        "409": { description: Version conflict or invalid state transition }
  /api/v1/fitness/nutrition:
    get:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: List original meal combinations and current account nutrition entries
      description: Local curated suggestions, not live restaurant data or nutrient analysis. Entries include preferences, favorites and dated plans, including soft-deleted rows.
      responses:
        "200":
          description: Catalog, account-scoped entries and UTC server time
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  data:
                    type: object
                    properties:
                      catalog:
                        type: array
                        items: { $ref: "#/components/schemas/NutritionCard" }
                      entries:
                        type: array
                        items: { $ref: "#/components/schemas/NutritionEntry" }
        "401": { description: Authentication required }
  /api/v1/fitness/nutrition/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: Save preferences, a favorite or a dated meal plan with optimistic revision
      description: New entries use revision 0. Preferences use id nutrition-preferences. Favorites use nutrition-favorite-{card_id}. Plans receive server-owned meal snapshots; clients cannot supply card contents. Future plans cannot be marked eaten. Active plans cannot duplicate the same card/date/slot, including restore operations. Kinds and card IDs are immutable. Per-account limit is 5000 rows including soft deletion. Identical immediate retries do not increment revision again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveNutritionInput" }
      responses:
        "200":
          description: Saved entry and UTC server time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/NutritionEntry" }
                  server_time: { type: string, format: date-time }
        "400": { description: Invalid input, unknown meal, unsupported slot or invalid date/state }
        "401": { description: Authentication required }
        "404": { description: Revision refers to an entry not found in current account }
        "409": { description: Version, immutable-field or duplicate-plan conflict; reconcile server state }
  /api/v1/fitness:
    get:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: List current account fitness entries, including trash and running sessions
      responses:
        "200":
          description: Account-scoped records and UTC server time for timer synchronization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FitnessEntry" }
                  server_time: { type: string, format: date-time }
        "401": { description: Authentication required }
  /api/v1/fitness/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    put:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: Save a routine, plan, manual log, daily check-in or personal goals using optimistic revision
      description: New entries use revision 0. Sessions cannot be saved here. Plans snapshot an owned routine; editing that routine later does not alter the plan. Settings use id fitness-settings. Each account has a 5000-entry limit including soft-deleted entries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFitnessInput" }
      responses:
        "200":
          description: Saved entry; an identical immediate retry does not increment revision twice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessResult" }
        "400": { description: Invalid JSON, fields, date, limits or state }
        "401": { description: Authentication required }
        "404": { description: Entry not found in current account }
        "409": { description: Revision conflict or modification of a plan linked to an active session }
  /api/v1/fitness/sessions/{id}/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    post:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: Start an owned routine or plan, or an unsaved template
      description: Supply source_id OR title/category/equipment/moves. A session stores its own snapshot. Only one active or paused session is allowed per account. Use one fixed id and identical body for retries; reconcile a conflict after later commands have advanced the session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartFitnessInput" }
      responses:
        "200":
          description: Started session or identical immediate retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessResult" }
        "400": { description: Invalid source or training input }
        "401": { description: Authentication required }
        "409": { description: An unfinished session exists, source plan changed or identifier already used }
  /api/v1/fitness/sessions/{id}/actions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" } }
    post:
      tags: [Fitness]
      security: [{ bearerAuth: [] }]
      summary: Execute a validated training state transition
      description: Keep command_id, revision and body unchanged when retrying. complete_set explicitly confirms one set, next exits rest, skip skips all remaining sets of the current move. Countdown expiry does not auto-complete. finish requires phase done and at least one completed set; stop preserves partial work. Completion atomically updates a linked plan. archive/restore/annotate apply only to terminal sessions. Pauses do not count toward elapsed time; rest and active waiting do, capped at 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FitnessActionInput" }
      responses:
        "200":
          description: Updated session, server time and current linked plan if present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessResult" }
        "400": { description: Invalid JSON, command or state transition }
        "401": { description: Authentication required }
        "404": { description: Session not found in current account }
        "409": { description: Stale revision; reconcile current server state }
  /api/v1/ai/chatgpt:
    get:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: 本机 ChatGPT 授权状态（不返回任何令牌）
      responses:
        "200":
          description: 当前本地账号的连接状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      connected: { type: boolean }
                      signed_in: { type: boolean }
                      pending: { type: boolean }
                      busy: { type: boolean }
                      email: { type: string }
                      message: { type: string }
                      diagnostic:
                        type: object
                        description: 安全的上游错误诊断，不包含原始正文或凭据，仅失败时出现
                        properties:
                          stage: { type: string }
                          http_status: { type: integer }
                          response_format: { type: string }
                          provider_code: { type: string }
                          provider_request_id: { type: string }
                          edge_request_id: { type: string }
                          proxy_planned: { type: boolean }
                          hint: { type: string }
        "401": { description: Authentication required }
        "403": { description: Loopback and same-origin access required }
  /api/v1/ai/chatgpt/connect:
    post:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: 创建一次性 PKCE 登录事务与临时 loopback 回调，返回官方授权 URL
      responses:
        "200":
          description: data.authorization_url，用户须亲自在浏览器登录授权
        "401": { description: Authentication required }
        "403": { description: Loopback and same-origin access required }
        "502": { description: 登录已在进行或本地注册存储失败 }
  /api/v1/ai/chatgpt/disconnect:
    post:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: 取消在途请求，清除本地令牌，尝试撤销远程会话（保留注册映射）
      responses:
        "200": { description: data.message 包含远程撤销是否已确认 }
        "401": { description: Authentication required }
        "403": { description: Loopback and same-origin access required }
  /api/v1/ai/chatgpt/models:
    get:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: 获取已授权 ChatGPT 账号实时可用模型
      responses:
        "200":
          description: data 数组，每项含 slug、display_name、visibility
        "401": { description: Authentication required }
        "403": { description: Loopback and same-origin access required }
        "502": { description: 未授权、权限/网络/额度错误或有在途请求 }
  /api/v1/ai/meals/recommend:
    post:
      tags: [AI, Meals]
      security: [{ bearerAuth: [] }]
      summary: 用 ChatGPT plan usage 决定吃什么，不返回菜谱，不自动保存或下单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, prompt, meal, channel, flavor, hunger]
              properties:
                model: { type: string, minLength: 1, maxLength: 100 }
                prompt: { type: string, minLength: 1, maxLength: 1200 }
                meal: { type: string, enum: [breakfast, lunch, dinner, snack] }
                channel: { type: string, enum: [any, delivery, dinein, ready] }
                budget: { type: integer, minimum: 0, maximum: 500, description: 每人参考预算上限，0 表示不限 }
                flavor: { type: string, enum: [any, mild, spicy] }
                hunger: { type: string, enum: [any, light, hearty] }
                vegetarian: { type: boolean }
                exclude: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
                recent: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        "200":
          description: data.summary 与 data.choices（0–3 个选择，参考预算及结构化偏好校验；不是实时商家价格，不保证忌口安全）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary: { type: string, maxLength: 500 }
                      choices:
                        type: array
                        maxItems: 3
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string, maxLength: 80 }
                            order: { type: string, maxLength: 200 }
                            reason: { type: string, maxLength: 300 }
                            budget_low: { type: integer, minimum: 0, maximum: 500 }
                            budget_high: { type: integer, minimum: 0, maximum: 500 }
                            channel: { type: string, enum: [delivery, dinein, ready] }
                            flavor: { type: string, enum: [mild, spicy] }
                            portion: { type: string, enum: [light, normal, hearty] }
                            vegetarian: { type: boolean }
        "400": { description: Invalid request JSON or input bounds }
        "401": { description: Authentication required }
        "403": { description: Loopback and same-origin access required }
        "502": { description: 模型不可用、未授权、额度不足、超时、未完成或食物推荐未通过校验 }
  /api/v1/meals:
    get:
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      summary: 获取当前账号菜谱及菜单（含软删除记录）
      responses:
        "200":
          description: Meal entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MealEntry" } }
        "401": { description: Authentication required }
  /api/v1/meals/{id}:
    put:
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      summary: 完整保存菜谱或菜单，期望版本校验及相同请求重试
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "200":
          description: Saved meal entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MealEntry" }
        "400": { description: Invalid recipe, date, ingredients or unavailable recipe }
        "401": { description: Authentication required }
        "404": { description: Update target not found }
        "409": { description: Stale revision, duplicate dish or recipe referenced by a menu }
  /api/v1/meals/shopping:
    post:
      tags: [Meals]
      security: [{ bearerAuth: [] }]
      summary: 原子合并所选菜谱或菜单食材至待购买清单，不覆盖已有数量
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 21, items: { type: string } }
                have: { type: array, maxItems: 840, items: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Added and existing pending ingredient counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      added: { type: integer, minimum: 0 }
                      existing: { type: integer, minimum: 0 }
        "400": { description: Invalid request or insufficient shopping capacity; no partial writes }
        "401": { description: Authentication required }
        "404": { description: Recipe or plan not found for this account }
  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      summary: 获取当前账号订阅（含回收站）
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Subscription" } }
        "401": { description: Authentication required }
  /api/v1/subscriptions/{id}:
    put:
      tags: [Subscriptions]
      security: [{ bearerAuth: [] }]
      summary: 完整保存订阅，期望版本校验及相同请求重试
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionInput" }
      responses:
        "200":
          description: Saved subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Authentication required }
        "404": { description: Missing record with nonzero revision }
        "409": { description: Version conflict }
  /api/v1/bookmarks:
    get:
      tags: [Bookmarks]
      summary: 当前账号全部收藏，含回收站
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 最多 3000 条，按更新时间倒序
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Bookmark' } }
        '401': { description: 未登录 }
  /api/v1/bookmarks/{id}:
    put:
      tags: [Bookmarks]
      summary: 创建或完整更新收藏
      description: 新建传 revision=0，更新传当前版本。相同 ID/版本/内容原样重试幂等；正常收藏按标准化后的 URL 去重，回收站可恢复但不提供永久删除。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkInput' }
      responses:
        '200':
          description: 保存后的收藏
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Bookmark' }
        '400': { description: 无效字段或超过数量限制 }
        '401': { description: 未登录 }
        '404': { description: 更新目标不存在 }
        '409': { description: 版本冲突或重复网址 }
  /api/v1/shopping:
    get:
      tags: [Shopping]
      summary: 当前账号的购物条目，包含已移除记录
      description: 最多 2000 条；按更新时间倒序。同名已购条目可复用，不提供独立购买历史。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: JSON data 数组，条目为 ShoppingInput 的字段，加上 id、user_id、created_at、updated_at；revision 为已保存版本。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
        '401': { description: 未登录 }
  /api/v1/shopping/{id}:
    put:
      tags: [Shopping]
      summary: 创建或完整更新购物条目
      description: 新建版本为 0，更新传入当前 revision。同 ID/版本/内容原样重试幂等。待购条目按去首尾空格、合并空白、转小写后的名称去重，检查在写锁内完成。移除设 deleted=true；买到设 purchased=true；复购设 purchased=false。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingInput' }
      responses:
        '200': { description: JSON data 为已保存条目，含新 revision、id、user_id、created_at、updated_at }
        '400': { description: 输入无效或超过容量 }
        '401': { description: 未登录 }
        '404': { description: 非零版本指向不存在的条目 }
        '409': { description: 版本冲突或已有同名待购项 }
  /api/v1/inventory:
    get:
      tags: [Inventory]
      summary: 当前账号的全部物品（含归档）
      description: 最多 1000 条，按更新时间倒序；搜索、状态过滤和分页由前端执行。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 物品列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryItem' }
        '401': { description: 未登录 }
  /api/v1/inventory/{id}:
    put:
      tags: [Inventory]
      summary: 创建或完整更新物品档案
      description: 新建 revision 为 0，更新传入当前版本。相同 ID、版本、内容的原样重试幂等。借出物品不能归档，确认归还应同时清空 borrower 和 return_on。价格为购入总价的整数分，不与生活账本自动同步。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
      responses:
        '200':
          description: 已保存（含新版本号）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InventoryItem' }
        '400': { description: 输入无效、超出数量限制或尝试归档借出物品 }
        '401': { description: 未登录 }
        '404': { description: 非零版本指向不存在的记录 }
        '409': { description: 版本冲突，保留草稿并重新载入 }
  /api/v1/travel-plans:
    get:
      tags: [Travel]
      summary: 当前账号的旅行档案，含归档
      description: 最多 50 条，按更新时间倒序；同一更新时间按 ID 排序。日期和时间均为目的地当地时间，不转换时区。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前账号的旅行数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TravelPlan' } }
        '401': { description: 未登录 }
  /api/v1/travel-plans/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' } }
    put:
      tags: [Travel]
      summary: 完整保存旅行、行程、预算和行李清单
      description: '首次 revision 为 0；修改传上次版本。相同版本及内容紧邻重试幂等，版本冲突返回 409。ID 按账号隔离。最多 50 趟旅行（含归档）、每趟 200 个行程和 100 个行李项；请求体上限 1 MiB。保存写入内存，落盘沿用周期快照机制。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TravelPlanInput' }
      responses:
        '200':
          description: 保存后的旅行，含递增 revision；幂等重试保持原版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TravelPlan' }
        '400': { description: 字段不合法、日期超出范围、重复标识或超过限额 }
        '401': { description: 未登录 }
        '404': { description: 更新目标不存在 }
        '409': { description: 旅行版本冲突，请保留草稿后重新读取 }
  /api/v1/projects:
    get:
      summary: 当前账号的项目列表（含归档项目与回收站卡片）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: data 为项目数组，含卡片、revision、created_at、updated_at }
        '401': { description: 未登录 }
  /api/v1/projects/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' } }
    put:
      summary: 完整保存单人项目，含卡片、检查清单和归档状态
      description: '首次 revision 为 0；编辑传上次版本。相同版本及内容重试幂等，冲突返回 409。ID 按账号隔离。每账号最多 50 个项目（含归档）；每项目最多 100 张卡片（含回收站）。请求体上限 1 MiB。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, color, cards, revision]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                archived: { type: boolean }
                revision: { type: integer, minimum: 0, maximum: 1000000 }
                cards:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [id, title, status, priority]
                    properties:
                      id: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' }
                      title: { type: string, minLength: 1, maxLength: 120 }
                      description: { type: string, maxLength: 3000 }
                      status: { type: string, enum: [todo, doing, done] }
                      priority: { type: string, enum: [low, normal, high] }
                      due: { type: string, description: 可为空，否则须为 2000–2100 年的 YYYY-MM-DD }
                      archived: { type: boolean }
                      checks:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          required: [title, done]
                          properties:
                            title: { type: string, minLength: 1, maxLength: 120 }
                            done: { type: boolean }
      responses:
        '200': { description: data 为保存后的完整项目，含递增的 revision }
        '400': { description: 字段不合法、重复卡片标识或超过限额 }
        '401': { description: 未登录 }
        '404': { description: 更新目标不存在 }
        '409': { description: 项目版本冲突，请保留草稿后重新读取 }
  /api/v1/ledger:
    get:
      summary: 当前账号的全部收支与月度预算（含回收站）
      description: 前端按月份、收支、分类、账户、备注及回收站状态筛选，每页 10 笔。金额单位为人民币分；此接口不提供银行余额或转账。
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'data 为账目数组，每条含 id、user_id、kind、amount、date、category、account、note、archived、revision、created_at、updated_at' }
        '401': { description: 未登录 }
  /api/v1/ledger/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,80}$' } }
    put:
      summary: 保存收支或预算，包括编辑、移入回收站和恢复
      description: 'ID 按账号隔离。首次 revision 为 0，更新携带上次版本；同一内容及版本的重试幂等。预算 ID 必须为 budget-YYYY-MM，日期为当月 01 日。普通账目 ID 建议 UUID，不能使用 budget- 前缀。每账号合计最多 10000 条（含回收站），不存在永久删除入口。'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount, date, revision]
              properties:
                kind: { type: string, enum: [expense, income, budget] }
                amount: { type: integer, minimum: 1, maximum: 10000000000, description: 人民币分，不接受小数 }
                date: { type: string, format: date, description: '2000-01-01 至 2100-12-31' }
                category: { type: string, maxLength: 24, description: 收支必填，预算忽略 }
                account: { type: string, maxLength: 24, description: 手动账户标签；收支必填，预算忽略 }
                note: { type: string, maxLength: 500 }
                archived: { type: boolean, default: false }
                revision: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        '200': { description: data 为保存后的完整记录和递增 revision }
        '400': { description: 输入无效或超过记录上限 }
        '401': { description: 未登录 }
        '404': { description: 更新目标不存在 }
        '409': { description: 版本冲突，保留草稿并重新读取记录后编辑 }
  /api/v1/keepsakes:
    get:
      summary: 当前账号的人生地图与博物馆记录（含照片与归档）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: data 为记录数组，前端筛选并按 8 条分页 }
        '401': { description: 未登录 }
  /api/v1/keepsakes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, minLength: 16, maxLength: 80 } }
    put:
      summary: 完整保存地点或展品；首次 revision 为 0，编辑传上次版本
      description: ID 建议客户端 UUID；同一版本及相同内容的请求重试幂等。归档和恢复也通过完整保存执行，不能切换 kind。每账号合计最多 200 条（含归档）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title, revision]
              properties:
                kind: { type: string, enum: [place, exhibit] }
                title: { type: string, minLength: 1, maxLength: 120 }
                story: { type: string, maxLength: 6000 }
                collection: { type: string, maxLength: 60 }
                category: { type: string, description: 'exhibit 必填：film、music、game、object、moment' }
                status: { type: string, description: 'place 必填：wish 或 visited' }
                date: { type: string, description: 可为空，否则为 YYYY-MM-DD }
                latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: 地点必填，WGS84 }
                longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: 地点必填，WGS84 }
                photo: { type: string, description: 可为空；JPEG/PNG base64 data URL，解码后最多 280000 字节、最大 1600×1600 }
                favorite: { type: boolean }
                archived: { type: boolean }
                revision: { type: integer, minimum: 0 }
      responses:
        '200': { description: data 为保存后记录，含新 revision、created_at 与 updated_at }
        '400': { description: 字段或图片无效，或数量超限 }
        '404': { description: 记录不存在或属于其他账号 }
        '409': { description: 版本冲突，请保留草稿并刷新核对 }
  /api/v1/daily-card:
    get:
      summary: 查询已抽签结果及收藏感受；未抽签返回元数据，body 为空，不触发抽签
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: 默认为中国标准时间的今天，可回看 2026-01-01 至今天
      responses:
        '200': { description: data 含 date、title、body、action、prompt、favorite、reflection }
        '400': { description: 无效或未来日期 }
        '401': { description: 未登录 }
  /api/v1/daily-card/draw:
    post:
      summary: 随机抽取今日签并自动保存；同账号当天并发与重试返回首次结果
      description: 使用中国标准时间，31 支原创生活签等概率抽取，不同日期可能重复。旧版当天已保存日签继续保留。无需请求体。
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: data 为已保存结果，新增签含 sign_number }
        '400': { description: 超过探索记录上限 }
        '401': { description: 未登录 }
  /api/v1/daily-card/{date}:
    parameters:
      - { in: path, name: date, required: true, schema: { type: string, format: date } }
    put:
      summary: 保存已抽签的收藏或感受，省略字段保持原值，未抽不可保存
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                favorite: { type: boolean }
                reflection: { type: string, maxLength: 3000 }
              description: 至少提供一个非 null 字段，空字符串可清空感受
      responses:
        '200': { description: data 为保存后的日签 }
        '400': { description: 日期或内容无效，或超过探索记录 500 条上限 }
        '409': { description: 此日期尚未抽签 }
  /api/v1/explore:
    get:
      summary: 当前账号的探索记录，未解锁信件正文为空
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'data 为记录数组，含 kind、locked、completed_at、reflection 等字段' }
        '401': { description: 未登录 }
  /api/v1/explore/{kind}:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [letter, challenge] }
    post:
      summary: 封存时光信或抽取生活挑战，相同账号和 ID 的重试返回原记录
      description: 每账号最多 500 条。letter 需要 title、body、unlock_at；challenge 需要 minutes、budget、place。解锁时间必须在未来十年内，预算按人民币估算。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, minLength: 16, maxLength: 80, description: 建议 UUID，失败重试必须保留原值 }
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 12000 }
                mood: { type: string, maxLength: 40 }
                unlock_at: { type: string, format: date-time }
                minutes: { type: integer, minimum: 5, maximum: 120 }
                budget: { type: integer, minimum: 0, maximum: 100 }
                place: { type: string, enum: [any, indoor, outdoor] }
      responses:
        '201': { description: data 为记录，信件到期前不返回正文 }
        '400': { description: 参数无效、超过上限或没有符合条件的挑战 }
        '409': { description: ID 已用于另一类记录 }
  /api/v1/explore/{id}/completion:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      summary: 完成生活挑战或更新感受，重复提交保留首次完成时间
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reflection: { type: string, maxLength: 3000 }
      responses:
        '200': { description: data 为更新后的挑战 }
        '400': { description: 感受内容过长 }
        '404': { description: 记录不存在或属于其他账号 }
        '409': { description: 信件不支持完成操作 }
  /api/v1/habits:
    get:
      summary: 列出当前账号的习惯及连续天数统计（包含归档）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'data 为习惯数组，含 today、current_streak、longest_streak、total 与 checkins 日期列表' }
        '401': { description: 未登录 }
    post:
      summary: 创建每日习惯（每账号最多 200 个，包含归档）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 300 }
                icon: { type: string, enum: [read, listen, write, move, water], default: read }
                time_zone: { type: string, default: Asia/Shanghai, description: 固定 IANA 时区，不允许 Local }
                weekly_target: { type: integer, minimum: 1, maximum: 7, default: 7, description: 每周目标完成天数；未传或传 0 兼容为每天，一天最多一次 }
      responses:
        '201': { description: data 为新习惯与统计 }
        '400': { description: 输入无效或超过数量上限 }
  /api/v1/habits/{habit_id}/checkins/{date}:
    parameters:
      - { in: path, name: habit_id, required: true, schema: { type: string } }
      - { in: path, name: date, required: true, schema: { type: string, format: date } }
    put:
      summary: 幂等打卡或撤销，仅允许创建日起至习惯时区的今天
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checked]
              properties:
                checked: { type: boolean }
      responses:
        '200': { description: data 为更新后的习惯与统计 }
        '400': { description: 无效日期或缺少布尔值 }
        '409': { description: 习惯已归档，请先恢复 }
        '404': { description: 习惯不存在或不属于当前账号 }
  /api/v1/habits/{habit_id}/archive:
    parameters:
      - { in: path, name: habit_id, required: true, schema: { type: string } }
    patch:
      summary: 归档或恢复习惯，保留全部历史记录
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        '200': { description: data 为更新后的习惯与统计 }
        '400': { description: 缺少有效布尔值 }
        '404': { description: 习惯不存在或不属于当前账号 }
  /api/v1/timeline:
    get:
      summary: 按月汇总现有学习记录的成长足迹
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - in: query
          name: kind
          schema: { type: string, enum: ['', task, todo, focus, book, memo] }
        - in: query
          name: offset
          description: UTC 偏移分钟数，例如中国标准时间为 480；默认为 UTC。
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: data 包含 items（id、kind、title、at、minutes）、total、page、pages、active_days、focus_minutes。每页 20 条，统计覆盖当前月份与类型的全部结果。
        '400':
          description: 筛选参数无效
        '401':
          description: 未登录
  /api/v1/weather:
    get:
      summary: 当前天气（Open-Meteo，15 分钟服务端缓存）
      security:
        - bearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: data 包含 current（Unix 秒时间、摄氏温度、体感、湿度、WMO 天气代码、昼夜、km/h 风速）、daily（最高最低温度）、timezone
        "400":
          description: 经纬度无效
        "401":
          description: 需要登录
        "502":
          description: 上游网络失败、超时或响应无效
  /api/v1/weather/locations:
    get:
      summary: 按城市名称搜索天气位置（最多 8 个结果）
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "200":
          description: data.results 包含 name、latitude、longitude、admin1、country；无结果时 results 可以省略
        "400":
          description: 搜索词无效
        "401":
          description: 需要登录
        "502":
          description: 城市搜索服务不可用
  /healthz:
