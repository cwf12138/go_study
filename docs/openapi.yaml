      parameters:
        - in: path
          name: work_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClassicalStudyRequest" }
      responses:
        "200":
          description: Updated learning state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ClassicalStudy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/literature/overview:
    get:
      tags: [Literature]
      security: [{ bearerAuth: [] }]
      summary: Get combined ebook and classical-learning statistics
      responses:
        "200":
          description: Literature studio overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LiteratureOverview" }
  /api/v1/exports/data:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download a versioned JSON backup of all personal StudyFlow data
      responses:
        "200":
          description: Portable backup; password credentials are never included
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDataExport" }
  /api/v1/exports/learning.csv:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download daily learning metrics as UTF-8 CSV
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
        - in: query
          name: time_zone
          schema: { type: string, example: Asia/Shanghai }
      responses:
        "200":
          description: CSV with a UTF-8 BOM for spreadsheet compatibility
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/exports/planner.ics:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download one planner week as an iCalendar file
      parameters:
        - in: query
          name: week_start
          schema: { type: string, format: date, description: Any date within the desired week }
      responses:
        "200":
          description: RFC 5545 compatible calendar
          content:
            text/calendar:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/dashboard:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: 获取学习仪表盘
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Dashboard" }
  /api/v1/events/stream:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: 订阅当前用户的 SSE 领域事件
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MoodDate:
      in: path
      name: date
      required: true
      schema: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$', example: '2026-08-29' }
    GoalID:
      in: path
      name: goal_id
      required: true
      schema: { type: string }
    TodoListID:
      in: path
      name: list_id
      required: true
      schema: { type: string }
    TodoID:
      in: path
      name: todo_id
      required: true
      schema: { type: string }
    TaskID:
      in: path
      name: task_id
      required: true
      schema: { type: string }
    PlanBlockID:
      in: path
      name: block_id
      required: true
      schema: { type: string }
    FocusSessionID:
      in: path
      name: session_id
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Invalid or missing access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Duplicate resource or invalid state transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    CalendarEventInput:
      type: object
      required: [title, start_at, end_at]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 6000 }
        location: { type: string, maxLength: 240 }
        category: { type: string, maxLength: 60, default: 学习 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: '#5b81ff' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        all_day: { type: boolean, default: false }
        repeat_rule: { type: string, enum: [none, daily, weekly, monthly, yearly], default: none }
        repeat_until: { type: string, format: date-time }
        reminder_minutes: { type: integer, minimum: 0, maximum: 40320, default: 0 }
    CalendarEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventInput"
        - type: object
          required: [id, user_id, created_at, updated_at]
          properties:
            id: { type: string }
            user_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CalendarDaySummary:
      type: object
      properties:
        date: { type: string, format: date }
        lunar: { type: string }
        solar_term: { type: string }
        festivals: { type: array, items: { type: string } }
        holiday_name: { type: string }
        holiday_type: { type: string, enum: [off, work] }
    CalendarOverview:
      type: object
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        days: { type: array, items: { $ref: "#/components/schemas/CalendarDaySummary" } }
        events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
        plan_blocks: { type: array, items: { $ref: "#/components/schemas/StudyPlanBlock" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/StudyTask" } }
        todos: { type: array, items: { $ref: "#/components/schemas/TodoItem" } }
        mood_entries: { type: array, items: { $ref: "#/components/schemas/MoodEntry" } }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    User:
      type: object
      required: [id, email, name, role, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [student, admin] }
        created_at: { type: string, format: date-time }
    AuthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
            token: { type: string }
    CreateGoalRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string }
        deadline: { type: string, format: date-time }
    Goal:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        description: { type: string }
        deadline: { type: string, format: date-time }
        status: { type: string, enum: [active, completed, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GoalListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    SaveMoodEntryRequest:
      type: object
      required: [mood, stress, energy]
      properties:
        mood: { type: string, enum: [awful, low, neutral, good, great] }
        note: { type: string, maxLength: 6000 }
        activities:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 48 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 48 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        energy: { type: integer, minimum: 1, maximum: 5 }
    MoodEntry:
      allOf:
        - $ref: "#/components/schemas/SaveMoodEntryRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    MoodActivityCount:
      type: object
      properties:
        name: { type: string }
        count: { type: integer, minimum: 0 }
    MoodInsights:
      type: object
      properties:
        month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        logged_days: { type: integer, minimum: 0 }
        average_mood: { type: number, minimum: 0, maximum: 5 }
        average_stress: { type: number, minimum: 0, maximum: 5 }
        average_energy: { type: number, minimum: 0, maximum: 5 }
        longest_streak: { type: integer, minimum: 0 }
        dominant_mood: { type: string, enum: [awful, low, neutral, good, great] }
        mood_distribution:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        top_activities:
          type: array
          items: { $ref: "#/components/schemas/MoodActivityCount" }
    MoodListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MoodEntry" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    TaskStatus:
      type: string
      enum: [todo, in_progress, done, cancelled]
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        goal_id: { type: string }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        estimated_minutes: { type: integer, minimum: 0, maximum: 1440 }
        priority: { type: string, enum: [low, medium, high], default: medium }
        due_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }
    StudyTask:
      allOf:
        - $ref: "#/components/schemas/CreateTaskRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            status: { $ref: "#/components/schemas/TaskStatus" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    CreateTodoListRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    TodoList:
      allOf:
        - $ref: "#/components/schemas/CreateTodoListRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            kind: { type: string, enum: [inbox, custom] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TodoStep:
      type: object
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        completed: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        list_id: { type: string }
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 6000 }
        priority: { type: string, enum: [low, medium, high], default: medium }
        due_at: { type: string, format: date-time }
        my_day_date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        repeat_rule: { type: string, enum: [none, daily, weekly, monthly], default: none }
        tags:
          type: array
          items: { type: string, maxLength: 48 }
        steps:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
    TodoItem:
      allOf:
        - $ref: "#/components/schemas/CreateTodoRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            status: { type: string, enum: [open, completed] }
            steps:
              type: array
              items: { $ref: "#/components/schemas/TodoStep" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    AvailabilityWindow:
      type: object
      required: [weekday, start_time, end_time]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday; Monday is 1." }
        start_time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        end_time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
    SavePlannerPreferencesRequest:
      type: object
      required: [time_zone, session_minutes, break_minutes, daily_max_minutes, windows]
      properties:
        time_zone: { type: string, example: Asia/Shanghai }
        session_minutes: { type: integer, minimum: 15, maximum: 180 }
        break_minutes: { type: integer, minimum: 0, maximum: 60 }
        daily_max_minutes: { type: integer, minimum: 30, maximum: 720 }
        windows:
          type: array
          minItems: 1
          maxItems: 28
          items: { $ref: "#/components/schemas/AvailabilityWindow" }
    PlannerPreferences:
      allOf:
        - $ref: "#/components/schemas/SavePlannerPreferencesRequest"
        - type: object
          properties:
            user_id: { type: string }
            updated_at: { type: string, format: date-time }
    PlanBlockKind:
      type: string
      enum: [task, todo, vocabulary, custom]
    PlanBlockStatus:
      type: string
      enum: [planned, in_progress, completed, skipped]
    CreatePlanBlockRequest:
      type: object
      required: [kind, title, start_at, end_at]
      properties:
        kind: { $ref: "#/components/schemas/PlanBlockKind" }
        source_id: { type: string, description: "Required for task and todo blocks." }
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 4000 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        priority: { type: string, enum: [low, medium, high], default: medium }
        locked: { type: boolean, default: false }
    StudyPlanBlock:
      allOf:
        - $ref: "#/components/schemas/CreatePlanBlockRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            planned_minutes: { type: integer, minimum: 10, maximum: 480 }
            status: { $ref: "#/components/schemas/PlanBlockStatus" }
            auto_generated: { type: boolean }
            rationale: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    UnscheduledPlanItem:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/PlanBlockKind" }
        source_id: { type: string }
        title: { type: string }
        remaining_minutes: { type: integer, minimum: 1 }
        reason: { type: string }
    PlanWeekSummary:
      type: object
      properties:
        total_blocks: { type: integer, minimum: 0 }
        completed_blocks: { type: integer, minimum: 0 }
        planned_minutes: { type: integer, minimum: 0 }
        completed_minutes: { type: integer, minimum: 0 }
        capacity_minutes: { type: integer, minimum: 0 }
        utilization: { type: number, minimum: 0 }
        overdue_sources: { type: integer, minimum: 0 }
        unscheduled_items: { type: integer, minimum: 0 }
        unscheduled_minutes: { type: integer, minimum: 0 }
    PlanWeek:
      type: object
      properties:
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        preferences: { $ref: "#/components/schemas/PlannerPreferences" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/StudyPlanBlock" }
        unscheduled:
          type: array
          items: { $ref: "#/components/schemas/UnscheduledPlanItem" }
        summary: { $ref: "#/components/schemas/PlanWeekSummary" }
    CreateWordBookRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        language: { type: string, default: en }
        daily_new_limit: { type: integer, minimum: 1, maximum: 100, default: 15 }
    WordBook:
      allOf:
        - $ref: "#/components/schemas/CreateWordBookRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            source_id: { type: string, description: Embedded catalog identifier }
            source_name: { type: string }
            source_url: { type: string, format: uri }
            license: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    VocabularyStage:
      type: string
      enum: [new, learning, reviewing, mastered]
    CreateVocabularyWordRequest:
      type: object
      required: [term, definition]
      properties:
        term: { type: string, maxLength: 160 }
        phonetic: { type: string, maxLength: 200 }
        definition: { type: string, maxLength: 3000 }
        example: { type: string, maxLength: 3000 }
        example_translation: { type: string, maxLength: 3000 }
        notes: { type: string, maxLength: 4000 }
        tags:
          type: array
          items: { type: string, maxLength: 48 }
    VocabularyWord:
      allOf:
        - $ref: "#/components/schemas/CreateVocabularyWordRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            book_id: { type: string }
            source_rank: { type: integer, minimum: 1, description: Source frequency order }
            stage: { $ref: "#/components/schemas/VocabularyStage" }
            ease_factor: { type: number, minimum: 1.3 }
            interval_days: { type: integer, minimum: 0 }
            repetitions: { type: integer, minimum: 0 }
            lapses: { type: integer, minimum: 0 }
            due_at: { type: string, format: date-time }
            last_reviewed_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    VocabularyReview:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        word_id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 4 }
        mode: { type: string, enum: [flashcard, spelling] }
        was_new: { type: boolean }
        reviewed_at: { type: string, format: date-time }
        next_due_at: { type: string, format: date-time }
    VocabularyOverview:
      type: object
      properties:
        total: { type: integer, minimum: 0 }
        new: { type: integer, minimum: 0 }
        learning: { type: integer, minimum: 0 }
        reviewing: { type: integer, minimum: 0 }
        mastered: { type: integer, minimum: 0 }
        due_today: { type: integer, minimum: 0 }
        reviewed_today: { type: integer, minimum: 0 }
        accuracy_today: { type: number, minimum: 0, maximum: 100 }
        study_streak: { type: integer, minimum: 0 }
    VocabularyCatalogSummary:
      type: object
      properties:
        id: { type: string, enum: [ielts, toefl] }
        name: { type: string }
        description: { type: string }
        exam: { type: string, enum: [IELTS, TOEFL] }
        language: { type: string, const: en }
        word_count: { type: integer, minimum: 1 }
        source_name: { type: string, const: ECDICT }
        source_url: { type: string, format: uri }
        license: { type: string, const: MIT }
        license_url: { type: string, format: uri }
        generated_at: { type: string, format: date }
        installed: { type: boolean }
        installed_book_id: { type: string }
        installed_word_count: { type: integer, minimum: 0 }
    VocabularyCatalogImport:
      type: object
      properties:
        catalog_id: { type: string, enum: [ielts, toefl] }
        book: { $ref: "#/components/schemas/WordBook" }
        added: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    FocusSession:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        task_id: { type: string }
        plan_block_id: { type: string }
        planned_minutes: { type: integer }
        actual_minutes: { type: integer }
        focused_seconds: { type: integer }
        break_enabled: { type: boolean }
        break_minutes: { type: integer, example: 5 }
        phase: { type: string, enum: [focus, focus_first, break, focus_second] }
        phase_started_at: { type: string, format: date-time }
        phase_remaining_seconds: { type: integer }
        status: { type: string, enum: [running, paused, completed, abandoned] }
        started_at: { type: string, format: date-time }
        paused_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    DailyLearningMetric:
      type: object
      properties:
        date: { type: string, format: date }
        focus_minutes: { type: integer, minimum: 0 }
        focus_sessions: { type: integer, minimum: 0 }
        planned_minutes: { type: integer, minimum: 0 }
        completed_plan_minutes: { type: integer, minimum: 0 }
        plan_adherence: { type: number, minimum: 0, maximum: 100 }
        tasks_completed: { type: integer, minimum: 0 }
        todos_completed: { type: integer, minimum: 0 }
        vocabulary_reviews: { type: integer, minimum: 0 }
        vocabulary_accuracy: { type: number, minimum: 0, maximum: 100 }
        mood_score: { type: integer, minimum: 1, maximum: 5 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        energy: { type: integer, minimum: 1, maximum: 5 }
    FocusHeatmapCell:
      type: object
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minutes: { type: integer, minimum: 0 }
    GoalLearningInsight:
      type: object
      properties:
        goal_id: { type: string }
        title: { type: string }
        total_tasks: { type: integer, minimum: 0 }
        completed_tasks: { type: integer, minimum: 0 }
        focus_minutes: { type: integer, minimum: 0 }
        completion_rate: { type: number, minimum: 0, maximum: 100 }
    LearningRecommendation:
      type: object
      properties:
        code: { type: string }
        level: { type: string, enum: [warning, attention, positive, info] }
        title: { type: string }
        description: { type: string }
        evidence: { type: string }
    LearningInsightSummary:
      type: object
      properties:
        total_focus_minutes: { type: integer, minimum: 0 }
        average_focus_minutes: { type: number, minimum: 0 }
        active_days: { type: integer, minimum: 0 }
        learning_streak: { type: integer, minimum: 0 }
        plan_adherence: { type: number, minimum: 0, maximum: 100 }
        tasks_completed: { type: integer, minimum: 0 }
        todos_completed: { type: integer, minimum: 0 }
        vocabulary_reviews: { type: integer, minimum: 0 }
        vocabulary_accuracy: { type: number, minimum: 0, maximum: 100 }
        consistency_score: { type: integer, minimum: 0, maximum: 100 }
        peak_focus_weekday: { type: integer, minimum: 1, maximum: 7 }
        peak_focus_hour: { type: integer, minimum: 0, maximum: 23 }
        mood_focus_correlation: { type: number, minimum: -1, maximum: 1 }
        stress_focus_correlation: { type: number, minimum: -1, maximum: 1 }
        due_vocabulary: { type: integer, minimum: 0 }
    LearningInsights:
      type: object
      properties:
        start_date: { type: string, format: date }
