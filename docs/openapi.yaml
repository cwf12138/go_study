      tags: [ImportantDays]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 返回 data 数组；日期为公历原始日期，客户端按北京时间计算倒数或已过天数。
        '401': { description: 需要登录 }
  /api/v1/important-days/{id}:
    put:
      summary: 创建或完整更新重要日子，支持版本校验与原样重试
      tags: [ImportantDays]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: 客户端生成的稳定标识 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, date, category, revision]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                date: { type: string, format: date, description: 公历日期，1900–2200 年 }
                category: { type: string, enum: [birthday, anniversary, plan, other] }
                note: { type: string, maxLength: 1000 }
                annual: { type: boolean, default: false }
                pinned: { type: boolean, default: false }
                deleted: { type: boolean, default: false, description: true 移入回收站，false 恢复 }
                revision: { type: integer, minimum: 0, description: 创建为 0，更新为上次读取版本 }
      responses:
        '200': { description: data 为保存结果，包含 id、user_id、revision、created_at、updated_at 和请求字段 }
        '400': { description: 输入或日期无效，或超过每账号 500 条限制（含回收站） }
        '401': { description: 需要登录 }
        '404': { description: 更新目标不存在或不属于当前账号 }
        '409': { description: 版本冲突，请重新读取并核对，不可盲目覆盖 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MoodDate:
      in: path
      name: date
      required: true
      schema: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$', example: '2026-08-29' }
    GoalID:
      in: path
      name: goal_id
      required: true
      schema: { type: string }
    TodoListID:
      in: path
      name: list_id
      required: true
      schema: { type: string }
    TodoID:
      in: path
      name: todo_id
      required: true
      schema: { type: string }
    TaskID:
      in: path
      name: task_id
      required: true
      schema: { type: string }
    PlanBlockID:
      in: path
      name: block_id
      required: true
      schema: { type: string }
    FocusSessionID:
      in: path
      name: session_id
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Invalid or missing access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Duplicate resource or invalid state transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SaveParcelInput:
      type: object
      additionalProperties: false
      required: [status]
      description: 完整替换可编辑字段，未传字段归零。名称、取件点、取件码或单号至少填写一项；单行字段禁止控制字符。原短信不应提交。
      properties:
        title: { type: string, maxLength: 80, description: 留空时保存为快递包裹 }
        carrier: { type: string, maxLength: 30 }
        location: { type: string, maxLength: 120 }
        pickup_code: { type: string, maxLength: 40 }
        tracking: { type: string, maxLength: 60 }
        deadline: { type: string, description: 可为空，否则为 2000–2200 年内公历 YYYY-MM-DD 日期；由用户自定，并非快递公司的保管期限 }
        note: { type: string, maxLength: 1000 }
        status: { type: string, enum: [ready, transit, picked] }
        deleted: { type: boolean, default: false }
        revision: { type: integer, minimum: 0, maximum: 1000000, default: 0, description: 创建为 0，更新传上次读取版本 }
    Parcel:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        carrier: { type: string }
        location: { type: string }
        pickup_code: { type: string }
        tracking: { type: string }
        deadline: { type: string }
        note: { type: string }
        status: { type: string, enum: [ready, transit, picked] }
        deleted: { type: boolean }
        revision: { type: integer }
        picked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransferFile:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string, maxLength: 180 }
        size: { type: integer, format: int64, minimum: 0, maximum: 33554432 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Digest at upload time, not a download-time integrity guarantee }
        ttl_hours: { type: integer, enum: [0, 24, 168] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        expired: { type: boolean }
        missing: { type: boolean, description: Missing, nonregular or size-mismatched server blob }
    BoardNode:
      type: object
      additionalProperties: false
      required: [id, kind, x, y, w, h, color, text, font_size, points]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{8,80}$" }
        kind: { type: string, enum: [note, text, rect, ellipse, path, arrow] }
        x: { type: number, minimum: 0, maximum: 1600 }
        y: { type: number, minimum: 0, maximum: 1000 }
        w: { type: number, minimum: 0, maximum: 1600 }
        h: { type: number, minimum: 0, maximum: 1000 }
        color: { type: string, enum: ["#344054", "#5578dd", "#438568", "#bf7053", "#f5dfa1", "#d8e7fa", "#ddd8f3", "#d5e9d9", "#efd6d6"] }
        text: { type: string, maxLength: 1000 }
        font_size: { type: integer, minimum: 14, maximum: 40 }
        points:
          type: array
          maxItems: 1000
          description: Empty for shapes; 2-1000 points for path; exactly two for arrow
          items:
            type: object
            additionalProperties: false
            properties:
              x: { type: number, minimum: 0, maximum: 1600 }
