openapi: 3.1.0
info:
  title: StudyFlow API
  version: 1.0.0
  description: 学习目标、任务、间隔复习、专注会话和实时事件 API。
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Goals
  - name: Moods
  - name: Tasks
  - name: Todos
  - name: Planner
  - name: Vocabulary
  - name: Review
  - name: Focus
  - name: Insights
  - name: Exports
paths:
  /healthz:
    get:
      summary: 进程健康状态
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册并获取访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: 当前用户
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/goals:
    post:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 创建学习目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 列出当前用户的目标
      parameters:
        - in: query
          name: status
          description: 按目标状态筛选；未提供时返回全部状态
          schema: { type: string, enum: [active, completed, archived] }
        - in: query
          name: sort
          description: 排序字段，默认 created_at
          schema: { type: string, enum: [created_at, updated_at, deadline, title], default: created_at }
        - in: query
          name: order
          description: 排序方向，默认 desc
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        "200":
          description: Goal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListEnvelope"
  /api/v1/moods:
    get:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 获取指定月份的心情日记
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-08' }
      responses:
        "200":
          description: Mood entries for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodListEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/moods/insights:
    get:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 获取指定月份的心情统计
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-08' }
      responses:
        "200":
          description: Monthly mood insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MoodInsights" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/moods/{date}:
    put:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 创建或更新某一天的心情日记
      parameters:
        - $ref: "#/components/parameters/MoodDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMoodEntryRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MoodEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 删除某一天的心情日记
      parameters:
        - $ref: "#/components/parameters/MoodDate"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks:
    post:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 创建学习任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 查询任务
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - in: query
          name: goal_id
          schema: { type: string }
        - in: query
          name: due_before
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StudyTask" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /api/v1/todo-lists:
    get:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 列出待办分类；首次访问会自动创建收集箱
      responses:
        "200":
          description: Todo lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TodoList" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
    post:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 创建待办分类
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodoListRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoList" }
  /api/v1/todo-lists/{list_id}:
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 删除自定义分类，并将其中待办移回收集箱
      parameters:
        - $ref: "#/components/parameters/TodoListID"
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/todos:
    get:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 查询待办，支持智能视图、分类、状态、优先级、标签和搜索
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [all, inbox, today, upcoming, completed], default: all }
        - in: query
          name: list_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [open, completed] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: date
          description: 用于 My Day 视图的日期
          schema: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
      responses:
        "200":
          description: Todos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TodoItem" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
    post:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 创建待办；未提供 list_id 时放入收集箱
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodoRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoItem" }
  /api/v1/todos/{todo_id}:
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 删除待办
      parameters:
        - $ref: "#/components/parameters/TodoID"
      responses:
        "204": { description: Deleted }
  /api/v1/todos/{todo_id}/status:
    patch:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 完成或重新打开待办；完成重复待办会创建下一个周期的事项
      parameters:
        - $ref: "#/components/parameters/TodoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoItem" }
                  next: { $ref: "#/components/schemas/TodoItem" }
  /api/v1/todos/{todo_id}/my-day:
    put:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 加入指定日期的我的一天
      parameters:
        - $ref: "#/components/parameters/TodoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 移出我的一天
      parameters:
        - $ref: "#/components/parameters/TodoID"
      responses:
        "200": { description: Updated }
  /api/v1/todos/{todo_id}/steps/{step_id}:
    patch:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 标记待办子步骤
      parameters:
        - $ref: "#/components/parameters/TodoID"
        - in: path
          name: step_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200": { description: Updated }
  /api/v1/goals/{goal_id}:
    delete:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 删除学习目标（关联任务会保留）
      parameters:
        - $ref: "#/components/parameters/GoalID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/goals/{goal_id}/status:
    patch:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 完成、归档或重新激活目标
      parameters:
        - in: path
          name: goal_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, completed, archived] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Goal" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tasks/{task_id}:
    delete:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 删除学习任务
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks/{task_id}/status:
    patch:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 推进任务状态
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyTask" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/planner/preferences:
    get:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 获取智能排程偏好；尚未保存时返回推荐默认值
      responses:
        "200":
          description: Planner preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlannerPreferences" }
    put:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 保存时区、专注长度、休息间隔、每日容量与可用时段
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePlannerPreferencesRequest" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlannerPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/planner/week:
    get:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 获取包含时间块、容量与上次排程报告的一周计划
      parameters:
        - in: query
          name: week_start
          description: 周内任意日期；服务会自动归一化到周一
          schema: { type: string, format: date }
      responses:
        "200":
          description: Weekly plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlanWeek" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/planner/generate:
    post:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 根据截止时间、优先级、预计时长、锁定时间和可用容量生成周计划
      description: 未锁定且未完成的旧自动时间块会被原子替换；手动、锁定和已完成时间块会被保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                week_start: { type: string, format: date }
      responses:
        "200":
          description: Generated weekly plan including work that could not fit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlanWeek" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/plan-blocks:
    post:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 手动添加一个时间块
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanBlockRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/plan-blocks/{block_id}:
    patch:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 修改时间、标题、优先级或锁定状态
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                notes: { type: string, maxLength: 4000 }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                priority: { type: string, enum: [low, medium, high] }
                locked: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 删除未在进行中的时间块
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/plan-blocks/{block_id}/status:
    patch:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 完成、跳过或重新打开时间块，并可同步完成关联任务或待办
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/PlanBlockStatus" }
                complete_source: { type: boolean, default: false }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/word-books:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 获取词书列表
      responses:
        "200":
          description: Word book list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WordBook" }
    post:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 创建词书
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWordBookRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WordBook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/word-books/{book_id}/words:
    post:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 向词书添加单词
      parameters:
        - in: path
          name: book_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVocabularyWordRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VocabularyWord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/words:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 查询词库
      parameters:
        - in: query
          name: book_id
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: stage
          schema: { $ref: "#/components/schemas/VocabularyStage" }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          description: Omit to keep the legacy unpaginated response; the web UI uses 100.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Word list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VocabularyWord" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /api/v1/words/queue:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 获取当前到期的单词学习队列
      parameters:
        - in: query
          name: book_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Due vocabulary queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VocabularyWord" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/vocabulary/overview:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 获取单词学习统计
      parameters:
        - in: query
          name: book_id
          schema: { type: string }
      responses:
        "200":
          description: Vocabulary statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VocabularyOverview" }
  /api/v1/vocabulary/catalogs:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: List built-in, attributed IELTS and TOEFL catalogs
      responses:
        "200":
          description: Catalogs with per-user installation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VocabularyCatalogSummary" }
  /api/v1/vocabulary/catalogs/{catalog_id}/import:
    post:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: Install or idempotently repair an embedded exam word book
      parameters:
        - in: path
          name: catalog_id
          required: true
          schema: { type: string, enum: [ielts, toefl] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                daily_new_limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Import result; repeated calls skip existing terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/VocabularyCatalogImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/words/{word_id}/reviews:
    post:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 记录一次单词回忆并计算下次复习时间
      parameters:
        - in: path
          name: word_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 4 }
                mode: { type: string, enum: [flashcard, spelling], default: flashcard }
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      word: { $ref: "#/components/schemas/VocabularyWord" }
                      review: { $ref: "#/components/schemas/VocabularyReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/words/{word_id}:
    delete:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 删除单词及其复习记录
      parameters:
        - in: path
          name: word_id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/decks:
    post:
      tags: [Review]
      security: [{ bearerAuth: [] }]
      summary: 创建卡组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Deck" }
    get:
      tags: [Review]
      security: [{ bearerAuth: [] }]
      summary: 列出卡组
      responses:
        "200":
          description: Deck list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Deck" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /api/v1/decks/{deck_id}/cards:
    post:
      tags: [Review]
      security: [{ bearerAuth: [] }]
      summary: 在卡组中创建卡片
      parameters:
        - in: path
          name: deck_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, answer]
              properties:
                prompt: { type: string }
                answer: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Card" }
  /api/v1/cards/due:
    get:
      tags: [Review]
      security: [{ bearerAuth: [] }]
      summary: 获取到期卡片
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Due cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Card" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /api/v1/cards/{card_id}/reviews:
    post:
      tags: [Review]
      security: [{ bearerAuth: [] }]
      summary: 提交复习结果
      parameters:
        - in: path
          name: card_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "200":
          description: Review scheduled
          content:
            application/json:
              schema:
                type: object
  /api/v1/focus-sessions:
    post:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 开始专注会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string }
                plan_block_id: { type: string, description: "When set, duration and linked task can be inherited from the plan block." }
                planned_minutes: { type: integer, minimum: 1, maximum: 240 }
                break_enabled: { type: boolean, default: false, description: "Split focus time into two segments with a fixed 5-minute break." }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusSession" }
  /api/v1/focus-sessions/active:
    get:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 获取当前正在进行的专注会话
      responses:
        "200":
          description: Active focus session; data is null when no session is active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/FocusSession"
                      - type: "null"
  /api/v1/focus-sessions/{session_id}/pause:
    post:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 暂停当前的专注或休息倒计时
      parameters:
        - $ref: "#/components/parameters/FocusSessionID"
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusSession" }
  /api/v1/focus-sessions/{session_id}/resume:
    post:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 继续已暂停的倒计时
      parameters:
        - $ref: "#/components/parameters/FocusSessionID"
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusSession" }
  /api/v1/focus-sessions/{session_id}/advance:
    post:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 在一个到期阶段后进入休息或第二段专注
      parameters:
        - $ref: "#/components/parameters/FocusSessionID"
      responses:
        "200":
          description: Advanced to the next phase
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusSession" }
  /api/v1/focus-sessions/{session_id}/finish:
    patch:
      tags: [Focus]
      security: [{ bearerAuth: [] }]
      summary: 完成或放弃专注会话
      parameters:
        - $ref: "#/components/parameters/FocusSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                abandoned: { type: boolean, default: false }
      responses:
        "200":
          description: Finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusSession" }
  /api/v1/analytics/learning:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: Get cross-module learning insights and recommendations
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
        - in: query
          name: time_zone
          schema: { type: string, example: Asia/Shanghai }
      responses:
        "200":
          description: Learning insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LearningInsights" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/reviews/weekly:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: Generate a weekly retrospective with a same-period comparison
      parameters:
        - in: query
          name: week_start
          schema: { type: string, format: date, description: Monday within the last 12 weeks }
        - in: query
          name: time_zone
          schema: { type: string, example: Asia/Shanghai }
      responses:
        "200":
          description: Weekly review
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WeeklyReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/reviews/weekly/reflection:
    put:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: Create or update a weekly reflection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWeeklyReflectionRequest" }
      responses:
        "200":
          description: Saved reflection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WeeklyReflection" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/reviews/weekly/reflections:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: List saved weekly reflections newest first
      responses:
        "200":
          description: Reflection archive
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WeeklyReflection" }
  /api/v1/exports/data:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download a versioned JSON backup of all personal StudyFlow data
      responses:
        "200":
          description: Portable backup; password credentials are never included
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDataExport" }
  /api/v1/exports/learning.csv:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download daily learning metrics as UTF-8 CSV
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
        - in: query
          name: time_zone
          schema: { type: string, example: Asia/Shanghai }
      responses:
        "200":
          description: CSV with a UTF-8 BOM for spreadsheet compatibility
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/exports/planner.ics:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Download one planner week as an iCalendar file
      parameters:
        - in: query
          name: week_start
          schema: { type: string, format: date, description: Any date within the desired week }
      responses:
        "200":
          description: RFC 5545 compatible calendar
          content:
            text/calendar:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/dashboard:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: 获取学习仪表盘
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Dashboard" }
  /api/v1/events/stream:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: 订阅当前用户的 SSE 领域事件
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MoodDate:
      in: path
      name: date
      required: true
      schema: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$', example: '2026-08-29' }
    GoalID:
      in: path
      name: goal_id
      required: true
      schema: { type: string }
    TodoListID:
      in: path
      name: list_id
      required: true
      schema: { type: string }
    TodoID:
      in: path
      name: todo_id
      required: true
      schema: { type: string }
    TaskID:
      in: path
      name: task_id
      required: true
      schema: { type: string }
    PlanBlockID:
      in: path
      name: block_id
      required: true
      schema: { type: string }
    FocusSessionID:
      in: path
      name: session_id
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Invalid or missing access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Duplicate resource or invalid state transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    User:
      type: object
      required: [id, email, name, role, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [student, admin] }
        created_at: { type: string, format: date-time }
    AuthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
            token: { type: string }
    CreateGoalRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string }
        deadline: { type: string, format: date-time }
    Goal:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        description: { type: string }
        deadline: { type: string, format: date-time }
        status: { type: string, enum: [active, completed, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GoalListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    SaveMoodEntryRequest:
      type: object
      required: [mood, stress, energy]
      properties:
        mood: { type: string, enum: [awful, low, neutral, good, great] }
        note: { type: string, maxLength: 6000 }
        activities:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 48 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 48 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        energy: { type: integer, minimum: 1, maximum: 5 }
    MoodEntry:
      allOf:
        - $ref: "#/components/schemas/SaveMoodEntryRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    MoodActivityCount:
      type: object
      properties:
        name: { type: string }
        count: { type: integer, minimum: 0 }
    MoodInsights:
      type: object
      properties:
        month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        logged_days: { type: integer, minimum: 0 }
        average_mood: { type: number, minimum: 0, maximum: 5 }
        average_stress: { type: number, minimum: 0, maximum: 5 }
        average_energy: { type: number, minimum: 0, maximum: 5 }
        longest_streak: { type: integer, minimum: 0 }
        dominant_mood: { type: string, enum: [awful, low, neutral, good, great] }
        mood_distribution:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        top_activities:
          type: array
          items: { $ref: "#/components/schemas/MoodActivityCount" }
    MoodListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MoodEntry" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    TaskStatus:
      type: string
      enum: [todo, in_progress, done, cancelled]
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        goal_id: { type: string }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        estimated_minutes: { type: integer, minimum: 0, maximum: 1440 }
        priority: { type: string, enum: [low, medium, high], default: medium }
        due_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }
    StudyTask:
      allOf:
        - $ref: "#/components/schemas/CreateTaskRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            status: { $ref: "#/components/schemas/TaskStatus" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    CreateTodoListRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    TodoList:
      allOf:
        - $ref: "#/components/schemas/CreateTodoListRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            kind: { type: string, enum: [inbox, custom] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TodoStep:
      type: object
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        completed: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        list_id: { type: string }
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 6000 }
        priority: { type: string, enum: [low, medium, high], default: medium }
        due_at: { type: string, format: date-time }
        my_day_date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        repeat_rule: { type: string, enum: [none, daily, weekly, monthly], default: none }
        tags:
          type: array
          items: { type: string, maxLength: 48 }
        steps:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
    TodoItem:
      allOf:
        - $ref: "#/components/schemas/CreateTodoRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            status: { type: string, enum: [open, completed] }
            steps:
              type: array
              items: { $ref: "#/components/schemas/TodoStep" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    AvailabilityWindow:
      type: object
      required: [weekday, start_time, end_time]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday; Monday is 1." }
        start_time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        end_time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
    SavePlannerPreferencesRequest:
      type: object
      required: [time_zone, session_minutes, break_minutes, daily_max_minutes, windows]
      properties:
        time_zone: { type: string, example: Asia/Shanghai }
        session_minutes: { type: integer, minimum: 15, maximum: 180 }
        break_minutes: { type: integer, minimum: 0, maximum: 60 }
        daily_max_minutes: { type: integer, minimum: 30, maximum: 720 }
        windows:
          type: array
          minItems: 1
          maxItems: 28
          items: { $ref: "#/components/schemas/AvailabilityWindow" }
    PlannerPreferences:
      allOf:
        - $ref: "#/components/schemas/SavePlannerPreferencesRequest"
        - type: object
          properties:
            user_id: { type: string }
            updated_at: { type: string, format: date-time }
    PlanBlockKind:
      type: string
      enum: [task, todo, review, vocabulary, custom]
    PlanBlockStatus:
      type: string
      enum: [planned, in_progress, completed, skipped]
    CreatePlanBlockRequest:
      type: object
      required: [kind, title, start_at, end_at]
      properties:
        kind: { $ref: "#/components/schemas/PlanBlockKind" }
        source_id: { type: string, description: "Required for task and todo blocks." }
        title: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 4000 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        priority: { type: string, enum: [low, medium, high], default: medium }
        locked: { type: boolean, default: false }
    StudyPlanBlock:
      allOf:
        - $ref: "#/components/schemas/CreatePlanBlockRequest"
        - type: object
          properties:
            id: { type: string }
            user_id: { type: string }
            planned_minutes: { type: integer, minimum: 10, maximum: 480 }
            status: { $ref: "#/components/schemas/PlanBlockStatus" }
            auto_generated: { type: boolean }
            rationale: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
    UnscheduledPlanItem:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/PlanBlockKind" }
        source_id: { type: string }
        title: { type: string }
        remaining_minutes: { type: integer, minimum: 1 }
        reason: { type: string }
    PlanWeekSummary:
      type: object
      properties:
        total_blocks: { type: integer, minimum: 0 }
        completed_blocks: { type: integer, minimum: 0 }
