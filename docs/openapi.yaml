openapi: 3.1.0
info:
  title: StudyFlow API
  version: 1.0.0
  description: 学习目标、任务、专注会话、词汇学习和实时事件 API。
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Goals
  - name: Moods
  - name: Calendar
  - name: Tasks
  - name: Todos
  - name: Planner
  - name: Vocabulary
  - name: Focus
  - name: Insights
  - name: Knowledge
  - name: English
  - name: Literature
  - name: Exports
paths:
  /healthz:
    get:
      summary: 进程健康状态
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册并获取访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: 当前用户
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/goals:
    post:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 创建学习目标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 列出当前用户的目标
      parameters:
        - in: query
          name: status
          description: 按目标状态筛选；未提供时返回全部状态
          schema: { type: string, enum: [active, completed, archived] }
        - in: query
          name: sort
          description: 排序字段，默认 created_at
          schema: { type: string, enum: [created_at, updated_at, deadline, title], default: created_at }
        - in: query
          name: order
          description: 排序方向，默认 desc
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        "200":
          description: Goal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListEnvelope"
  /api/v1/moods:
    get:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 获取指定月份的心情日记
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-08' }
      responses:
        "200":
          description: Mood entries for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodListEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/moods/insights:
    get:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 获取指定月份的心情统计
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-08' }
      responses:
        "200":
          description: Monthly mood insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MoodInsights" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/moods/{date}:
    put:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 创建或更新某一天的心情日记
      parameters:
        - $ref: "#/components/parameters/MoodDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMoodEntryRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MoodEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Moods]
      security: [{ bearerAuth: [] }]
      summary: 删除某一天的心情日记
      parameters:
        - $ref: "#/components/parameters/MoodDate"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks:
    post:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 创建学习任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 查询任务
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - in: query
          name: goal_id
          schema: { type: string }
        - in: query
          name: due_before
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StudyTask" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /api/v1/todo-lists:
    get:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 列出待办分类；首次访问会自动创建收集箱
      responses:
        "200":
          description: Todo lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TodoList" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
    post:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 创建待办分类
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodoListRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoList" }
  /api/v1/todo-lists/{list_id}:
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 删除自定义分类，并将其中待办移回收集箱
      parameters:
        - $ref: "#/components/parameters/TodoListID"
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/todos:
    get:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 查询待办，支持智能视图、分类、状态、优先级、标签和搜索
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [all, inbox, today, upcoming, completed], default: all }
        - in: query
          name: list_id
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [open, completed] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: date
          description: 用于 My Day 视图的日期
          schema: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
      responses:
        "200":
          description: Todos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TodoItem" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
    post:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 创建待办；未提供 list_id 时放入收集箱
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodoRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoItem" }
  /api/v1/todos/{todo_id}:
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 删除待办
      parameters:
        - $ref: "#/components/parameters/TodoID"
      responses:
        "204": { description: Deleted }
  /api/v1/todos/{todo_id}/status:
    patch:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 完成或重新打开待办；完成重复待办会创建下一个周期的事项
      parameters:
        - $ref: "#/components/parameters/TodoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TodoItem" }
                  next: { $ref: "#/components/schemas/TodoItem" }
  /api/v1/todos/{todo_id}/my-day:
    put:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 加入指定日期的我的一天
      parameters:
        - $ref: "#/components/parameters/TodoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 移出我的一天
      parameters:
        - $ref: "#/components/parameters/TodoID"
      responses:
        "200": { description: Updated }
  /api/v1/todos/{todo_id}/steps/{step_id}:
    patch:
      tags: [Todos]
      security: [{ bearerAuth: [] }]
      summary: 标记待办子步骤
      parameters:
        - $ref: "#/components/parameters/TodoID"
        - in: path
          name: step_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200": { description: Updated }
  /api/v1/calendar:
    get:
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      summary: 获取日期范围内的公历/农历信息与聚合日程
      parameters:
        - { in: query, name: start, required: true, schema: { type: string, format: date } }
        - { in: query, name: end, required: true, description: Exclusive end date; a range may contain at most 370 days., schema: { type: string, format: date } }
      responses:
        "200":
          description: Calendar range
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CalendarOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/calendar/days/{date}:
    get:
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      summary: 获取某日农历、节气、黄历、每日一签和历史事件
      parameters:
        - { in: path, name: date, required: true, schema: { type: string, format: date } }
        - { in: query, name: history, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Day detail }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/calendar/events:
    post:
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      summary: 创建个人日程
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CalendarEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/calendar/events/{event_id}:
    patch:
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      summary: 更新个人日程或整个重复系列
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Calendar]
      security: [{ bearerAuth: [] }]
      summary: 删除个人日程或整个重复系列
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/goals/{goal_id}:
    delete:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 删除学习目标（关联任务会保留）
      parameters:
        - $ref: "#/components/parameters/GoalID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/goals/{goal_id}/status:
    patch:
      tags: [Goals]
      security: [{ bearerAuth: [] }]
      summary: 完成、归档或重新激活目标
      parameters:
        - in: path
          name: goal_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, completed, archived] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Goal" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tasks/{task_id}:
    delete:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 删除学习任务
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks/{task_id}/status:
    patch:
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      summary: 推进任务状态
      parameters:
        - $ref: "#/components/parameters/TaskID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyTask" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/planner/preferences:
    get:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 获取智能排程偏好；尚未保存时返回推荐默认值
      responses:
        "200":
          description: Planner preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlannerPreferences" }
    put:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 保存时区、专注长度、休息间隔、每日容量与可用时段
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePlannerPreferencesRequest" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlannerPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/planner/week:
    get:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 获取包含时间块、容量与上次排程报告的一周计划
      parameters:
        - in: query
          name: week_start
          description: 周内任意日期；服务会自动归一化到周一
          schema: { type: string, format: date }
      responses:
        "200":
          description: Weekly plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlanWeek" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/planner/generate:
    post:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 根据截止时间、优先级、预计时长、锁定时间和可用容量生成周计划
      description: 未锁定且未完成的旧自动时间块会被原子替换；手动、锁定和已完成时间块会被保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                week_start: { type: string, format: date }
      responses:
        "200":
          description: Generated weekly plan including work that could not fit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlanWeek" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/plan-blocks:
    post:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 手动添加一个时间块
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanBlockRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/plan-blocks/{block_id}:
    patch:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 修改时间、标题、优先级或锁定状态
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                notes: { type: string, maxLength: 4000 }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                priority: { type: string, enum: [low, medium, high] }
                locked: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 删除未在进行中的时间块
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/plan-blocks/{block_id}/status:
    patch:
      tags: [Planner]
      security: [{ bearerAuth: [] }]
      summary: 完成、跳过或重新打开时间块，并可同步完成关联任务或待办
      parameters:
        - $ref: "#/components/parameters/PlanBlockID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/PlanBlockStatus" }
                complete_source: { type: boolean, default: false }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StudyPlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/word-books:
    get:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 获取词书列表
      responses:
        "200":
          description: Word book list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WordBook" }
    post:
      tags: [Vocabulary]
      security: [{ bearerAuth: [] }]
      summary: 创建词书
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWordBookRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WordBook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/word-books/{book_id}/words:
    post:
